<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目后勤 · 报销工作台</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script><script src="/receipt.js" defer></script><script src="/report.js" defer></script><script src="/mail-search.js" defer></script><script src="/expense-classifier.js" defer></script><script src="/intake.js" defer></script></head>
<body><aside class="rail"><div class="brand">后勤<span>DESK</span></div><p>项目支出与报销材料</p><a id="logisticsNav" hidden href="/logistics" style="display:block;padding:14px;color:inherit;text-decoration:none">后勤任务</a><button class="nav active" data-view="all">▦　事项台账</button><button class="nav" data-view="inbox">▤　邮件收件箱 <span id="inboxCount"></span></button><div class="railnote">本机工作台<br>文件保存在这台电脑<br><small>飞书负责收件 · 工作台负责核对</small></div></aside>
<main><header><div class="eyebrow">PROJECT OPERATIONS</div><div class="heading"><div><h1>报销材料工作台</h1><p>上传购买凭证，先记支出，再补发票。</p></div><div class="actions"><button class="primary" id="recognizeReceipt">＋ 批量上传凭证并识别</button><button id="newItem">手动登记</button></div></div></header>
<div id="error" role="alert" hidden></div><div id="notice" role="status" hidden></div>
<section class="metrics" id="metrics"></section>
<section class="toolbar"><div><select id="projectFilter" aria-label="项目筛选"><option value="">所有项目</option></select><select id="categoryFilter" aria-label="类别筛选"><option value="">所有类别</option></select><input id="search" placeholder="搜索事项、商家、订单号…" aria-label="搜索事项"></div><div><button id="importHistory">同步历史打印记录</button><button id="checkMail">补收邮件</button></div></section>
<section class="workspace"><div class="listpanel"><div class="tabs" id="tabs"><button data-view="all" class="active">全部事项</button><button data-view="missing">待补材料</button><button data-view="review">待核对</button><button data-view="ready">可提交</button><button data-view="submitted">已提交</button><button data-view="reimbursed">已报销</button></div><div class="listhead"><div><div id="selectionTools" class="selection-tools"><label><input type="checkbox" id="selectVisible">全选当前列表</label><button id="clearSelected" type="button" disabled>清空勾选</button><button id="verifySelected" type="button" disabled>批量核对完成</button></div><span id="listSummary" role="status"></span></div><button id="exportSelected">导出勾选 PDF＋MD</button></div><div id="list"></div></div><aside id="detail" class="detail"><div class="empty"><span>▤</span><h2>每笔支出，一个材料夹</h2><p>选择左侧事项，查看缺失材料、上传凭证或更新报销状态。</p><p>酒店、高铁：发票<br>材料采购：购买凭证＋发票或扣费记录</p></div></aside></section>
<footer>材料齐全 ≠ 已报销。核对金额与内容后再提交；打印最终 PDF 请选择 A4、1×1。</footer></main>
<dialog id="createDialog"><div class="dialoghead"><h2>登记一笔事项</h2><button id="closeDialog" aria-label="关闭">×</button></div><p class="muted">暂时没有发票也可以登记，材料随时补充。</p><form id="createForm"></form></dialog>
</body></html>
