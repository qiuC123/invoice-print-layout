<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目后勤 · 工作台</title><link rel="stylesheet" href="/logistics.css"><script src="/logistics.js" defer></script></head><body>
<aside class="project-rail" aria-label="项目导航"><a class="brand" href="/logistics">后勤工作台<span>PROJECT DESK</span></a><div class="rail-heading"><h2>我的项目</h2><button id="showProjectForm" aria-expanded="false" aria-controls="projectForm">＋ 新建</button></div>
<form id="projectForm" hidden><label>项目名称<input name="name" required maxlength="120" placeholder="输入项目名称"></label><label>工作地点（选填）<input name="site_name" maxlength="200" placeholder="例如：项目所在园区"></label><button class="primary" type="submit">创建项目</button></form><nav id="projectList" aria-label="选择项目"></nav><button class="project-option unassigned" id="unassignedInbox">待归属收件箱</button><a class="ledger-link" href="/">打开事项台账 ↗</a><p class="rail-note">我的后勤空间<br>个人工作台</p></aside>
<main><header><div class="eyebrow" id="projectBreadcrumb">我的项目</div><div class="heading"><div><h1 id="projectTitle">后勤工作台</h1><p id="projectSummary">正在读取项目…</p></div><button id="refreshLogistics">刷新</button></div></header>
<p id="logisticsError" class="error" role="alert" hidden></p><p id="logisticsNotice" class="notice" role="status" hidden></p><div id="transportStatus" class="banner">正在读取消息接收状态…</div>
<nav class="tabs" aria-label="项目内容"><button data-tab="inbox" class="active" aria-pressed="true">消息收件箱</button><button data-tab="groups" aria-pressed="false">微信群</button><button data-tab="tasks" aria-pressed="false">后勤安排</button></nav>
<section id="inboxPanel"><div class="section-heading"><h2 id="inboxHeading">全部消息</h2><div class="filters"><label>消息分类<select id="messageFilter"><option value="">全部分类</option></select></label><label>微信群<select id="groupFilter"><option value="">全部群</option></select></label></div></div><p class="muted" id="inboxCount">保留原消息，手动核对项目归属和业务分类。</p><div id="logisticsInbox" aria-live="polite"></div></section>
<section id="groupsPanel" hidden><div class="section-heading"><h2>项目微信群</h2><button id="showGroupForm" class="primary" aria-expanded="false" aria-controls="groupForm">＋ 添加微信群</button></div><p id="groupsHint" class="muted"></p><form id="groupForm" class="card group-form" hidden><div class="form-grid"><label>群名称<input name="name" required placeholder="例如：现场沟通群"></label><label>用途<select name="category" id="newGroupCategory"></select></label></div><details id="manualBinding"><summary>手动绑定 · 填写稳定标识</summary><p class="muted">当前实时接收未联通时，不能靠群昵称自动识别。请填写接收工具提供的账号和会话标识；这里只保存绑定关系。</p><div class="form-grid"><label>微信账号标识<input name="account_id" autocomplete="off" placeholder="account_id"></label><label>群会话标识<input name="chat_id" autocomplete="off" placeholder="chat_id"></label></div></details><button type="submit" class="primary">保存群绑定</button></form><div id="logisticsGroups"></div></section>
<section id="tasksPanel" hidden><div class="section-heading"><h2>后勤任务</h2></div><div id="logisticsTasks"></div><section class="card"><h2>消息进度</h2><div id="logisticsOutbox"></div></section></section>
<footer>这里只整理项目和消息。订餐通知需要你确认；房间安排先核对，不自动退房或合房。</footer>
</main></body></html>
