<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · 人员照片时间预览</title>
<style>
:root{color-scheme:light;--ink:#243b53;--muted:#627d98;--line:#d9e2ec;--paper:#fff;--bg:#f4f7fa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Microsoft YaHei",sans-serif}main{max-width:1480px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 4px}p{margin:4px 0;color:var(--muted)}.filters{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 12px}label{display:flex;align-items:center;gap:6px}select,button{font:inherit;border:1px solid var(--line);border-radius:6px;padding:7px;background:white;color:var(--ink)}select:focus,button:focus{outline:2px solid #168aad}h2{font-size:19px;margin:28px 0 8px;border-bottom:1px solid var(--line);padding-bottom:6px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}.card{display:block;overflow:hidden;text-align:left;padding:0;width:100%;cursor:pointer;background:white}.card img{width:100%;height:250px;object-fit:contain;background:#e6edf2;display:block}.body{padding:12px}.role{font-weight:600;font-size:17px}.meta{font-size:12px;color:var(--muted);margin-top:6px;overflow-wrap:anywhere}.tag{font-size:12px;padding:2px 6px;background:#e6f1f5;border-radius:4px;margin-left:8px}.pending{background:#fff1d6}dialog{width:min(1120px,96vw);max-height:94vh;border:0;border-radius:10px;padding:14px;color:var(--ink)}dialog::backdrop{background:#172b4de0}.viewer-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}#large{display:block;max-width:100%;height:72vh;object-fit:contain;margin:10px auto}.actions{display:flex;gap:8px}#caption{overflow-wrap:anywhere;font-size:13px}#empty{padding:40px;text-align:center;border:1px dashed var(--line)}@media(max-width:600px){main{padding:14px}h1{font-size:20px}.grid{grid-template-columns:1fr}.filters{gap:8px}label{font-size:13px}select{max-width:170px}.card img{height:300px}#large{height:62vh}}
</style>
</head>
<body><main>
<h1>__TITLE__ · 人员照片时间</h1>
<p id="range"></p><p>按水印拍摄时间排序；岗位采用交接标签和用户纠正。照片张数不等于人数，拍照跨度不作为个人工时。</p>
<div class="filters">
<label>日期<select id="date"><option value="">全部日期</option></select></label>
<label>时段<select id="period"><option value="">全部时段</option><option>上午</option><option>下午</option><option>晚间</option></select></label>
<label>岗位<select id="role"><option value="">全部岗位</option></select></label>
<label>项目归属<select id="project"><option value="">全部照片</option><option value="included">当前项目</option><option value="pending">归属待核</option><option value="excluded">异地排除</option></select></label>
<button id="reset">重置</button></div><p id="count" aria-live="polite"></p>
<div id="gallery"></div><p id="empty" hidden>此组合没有照片。</p>
</main>
<dialog id="viewer"><div class="viewer-head"><strong id="viewer-title"></strong><div class="actions"><button id="previous" aria-label="上一张">← 上一张</button><button id="next" aria-label="下一张">下一张 →</button><button id="close">关闭</button></div></div><img id="large" alt=""><div id="caption"></div></dialog>
<script>
const DATA = __DATA__;
// FILTERS_BEGIN
function selectRows(records, filters) {
  return records.filter(r => (!filters.date || r.date === filters.date) && (!filters.period || r.period === filters.period) && (!filters.role || r.role === filters.role) && (!filters.project || r.project_status === filters.project));
}
// FILTERS_END
const $ = id => document.getElementById(id);
let visible = [], current = 0;
function element(tag, text, className) { const e = document.createElement(tag); if(text !== undefined) e.textContent = text; if(className) e.className = className; return e; }
for(const day of [...new Set(DATA.records.map(r => r.date))]) $('date').append(element('option', day));
for(const role of [...new Set(DATA.records.map(r => r.role))]) $('role').append(element('option', role));
$('range').textContent = `${DATA.records[0].date} 至 ${DATA.records[DATA.records.length - 1].date} · ${DATA.records.length}张`;
function render() {
  visible = selectRows(DATA.records, {date:$('date').value,period:$('period').value,role:$('role').value,project:$('project').value});
  $('count').textContent = `显示 ${visible.length} / ${DATA.records.length} 张`;
  $('empty').hidden = visible.length > 0; $('gallery').replaceChildren(); let grid, last = '';
  visible.forEach((r, index) => {
    const bucket = `${r.date} · ${r.period}`;
    if(bucket !== last) { $('gallery').append(element('h2', bucket)); grid = element('div', undefined, 'grid'); $('gallery').append(grid); last = bucket; }
    const card = element('button', undefined, 'card'); card.setAttribute('aria-label', `${r.date} ${r.photo_time} ${r.role}，查看照片`);
    const img = element('img'); img.src = r.path; img.alt = `${r.photo_id} · ${r.role} · ${r.photo_time}`; img.loading = 'lazy';
    const body = element('div', undefined, 'body'), title = element('div', r.role, 'role'); title.append(element('span', r.project_status_label, r.project_status === 'included' ? 'tag' : 'tag pending'));
    body.append(title, element('div', `${r.photo_id} · 水印 ${r.photo_time}`, 'meta'));
    if(r.user_note) body.append(element('div', r.user_note, 'meta'));
    card.append(img, body); card.addEventListener('click', () => { current = index; showPhoto(); $('viewer').showModal(); }); grid.append(card);
  });
}
function showPhoto() {
  const r = visible[current]; if(!r) return;
  $('large').src = r.path; $('large').alt = `${r.photo_id} · ${r.role}`;
  $('viewer-title').textContent = `${current + 1}/${visible.length} · ${r.date} ${r.photo_time} · ${r.role}`;
  $('caption').textContent = [r.photo_id,r.project_status_label,r.location,r.role_basis,r.user_note].filter(Boolean).join(' · ');
  $('previous').disabled = current === 0; $('next').disabled = current === visible.length - 1;
}
function move(delta) { current = Math.max(0, Math.min(visible.length - 1, current + delta)); showPhoto(); }
['date','period','role','project'].forEach(id => $(id).addEventListener('change', render));
$('reset').addEventListener('click', () => { ['date','period','role','project'].forEach(id => $(id).value = ''); render(); });
$('previous').addEventListener('click', () => move(-1)); $('next').addEventListener('click', () => move(1)); $('close').addEventListener('click', () => $('viewer').close());
$('viewer').addEventListener('keydown', e => { if(e.key === 'ArrowLeft') move(-1); if(e.key === 'ArrowRight') move(1); });
render();
</script></body></html>
