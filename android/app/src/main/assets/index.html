<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:; connect-src 'none'"><title>发票助手</title><link rel="stylesheet" href="style.css"></head><body>
<header id="workbenchHeader"><div class="brand"><span class="mark">票</span><div><h1>发票助手</h1><p>材料、费用与报销，随身整理</p></div><button class="icon" id="newProject" aria-label="新建项目">＋</button></div><div class="project-line"><label for="project">当前项目</label><select id="project" aria-label="当前项目"></select><button class="subtle" id="reimbursement">未报销</button></div></header>
<main id="workbenchMain"><section class="overview"><p>已核对待提交</p><div class="total" id="total">¥0.00</div><div class="metrics"><span id="verifiedCount">0 笔费用</span><span id="reviewCount">0 笔待核对</span><span id="materialCount">0 份待整理</span></div></section><div class="section-head"><h2 id="sectionTitle">待整理材料</h2></div><div id="filters"></div><div id="shareBanner" hidden></div><div id="content"></div></main>
<section id="settingsPage" hidden aria-labelledby="settingsTitle"><div class="settings-header"><button type="button" class="icon" id="settingsBack" aria-label="返回上一页">‹</button><div><h1 id="settingsTitle">设置</h1><p id="settingsProject"></p></div></div><div class="settings-content" id="settingsContent"></div></section>
<div class="action-bar" id="actions"></div><nav aria-label="工作阶段"><button data-tab="materials" class="active"><span>▤</span>材料</button><button data-tab="review"><span>✓</span>待核对</button><button data-tab="verified"><span>☷</span>待提交</button><button data-tab="reports"><span>▧</span>打印包</button><button data-tab="settings"><span>⚙</span>设置</button></nav>
<dialog id="dialog"><form id="dialogForm"><div class="dialog-head"><h2 id="dialogTitle"></h2><button type="button" class="icon" id="closeDialog" aria-label="关闭">×</button></div><p id="dialogError" role="alert" hidden></p><div id="dialogBody"></div><div class="dialog-actions"><button type="button" id="cancelDialog" class="secondary">取消</button><button type="submit" id="confirmDialog">保存</button></div></form></dialog><div id="toast" role="status" hidden></div><script src="app.js"></script><script src="workbench.js"></script></body></html>
