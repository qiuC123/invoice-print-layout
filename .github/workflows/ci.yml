name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONPATH: src

jobs:
  python:
    name: Python checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Create the application virtual environment
        run: |
          python -m venv .venv
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -e ".[dev]"
      - name: Full pytest (includes agent rules)
        run: python -m pytest -n 4 -ra --junitxml=.runtime/ci/pytest.xml
      - name: Strict type check
        if: ${{ !cancelled() }}
        run: python -m mypy src
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: pytest-results
          path: .runtime/ci/pytest.xml
          include-hidden-files: true
          retention-days: 7

  browser:
    name: Browser contracts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Create the application virtual environment
        run: |
          python -m venv .venv
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
      - run: npx playwright install chromium
      - name: All tracked browser contracts
        run: node scripts/run-browser-tests.mjs --output=.runtime/ci/browser
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-results
          path: .runtime/ci/browser
          include-hidden-files: true
          retention-days: 7
