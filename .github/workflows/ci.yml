name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONPATH: src

jobs:
  python:
    name: Python checks (${{ matrix.shard }}/6)
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Create the application virtual environment
        run: |
          python -m venv .venv
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -e ".[dev]"
      - name: Full pytest (includes agent rules)
        run: |
          $files = @(git ls-files tests | Where-Object { $_ -match '(^|/)(test_[^/]*|[^/]*_test)\.py$' } | Sort-Object)
          $selected = @(for ($i = ${{ matrix.shard }} - 1; $i -lt $files.Count; $i += 6) { $files[$i] })
          if (!$selected.Count -or @($selected | Select-Object -Unique).Count -ne $selected.Count) { throw 'Invalid pytest shard' }
          Write-Host "Shard ${{ matrix.shard }}/6: $($selected.Count) of $($files.Count) test files"
          python -m pytest @selected -n 4 -ra --junitxml=.runtime/ci/pytest-${{ matrix.shard }}.xml
      - name: Strict type check
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: python -m mypy src
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: pytest-results-${{ matrix.shard }}
          path: .runtime/ci/pytest-${{ matrix.shard }}.xml
          include-hidden-files: true
          retention-days: 7

  browser:
    name: Browser contracts
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Create the application virtual environment
        run: |
          python -m venv .venv
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
      - run: npx playwright install chromium
      - name: All tracked browser contracts
        run: node scripts/run-browser-tests.mjs --output=.runtime/ci/browser
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: browser-results
          path: .runtime/ci/browser
          include-hidden-files: true
          retention-days: 7
